name: pazulu_reader
description: Pazulu Reader - lecture, suivi et organisation de mangas, manhwas, manhuas et animes.
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.7
  path_provider: ^2.1.0
  file_picker: '>=8.0.0 <11.0.0'
  crypto: ^3.0.3
  webview_flutter: ^4.10.0
  webview_win_floating: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/suggested_sources.json
    - assets/extensions/
    - assets/logo/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 900
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
